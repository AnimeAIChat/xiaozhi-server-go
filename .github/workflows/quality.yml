name: Quality Gate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Go test, static checks, and frontend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
      - name: Run tests with the race detector
        run: go test -race ./...
      - name: Run go vet
        run: go vet ./...
      - name: Check frontend JavaScript syntax
        run: node --check web/assets/app.js
