name: Build release packages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows AMD64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
      - name: Install cross-compilation tools
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
        run: go build -trimpath -ldflags "-s -w -extldflags '-static'" -o dist/windows-amd64/xiaozhi-server.exe ./src/main.go
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-amd64
          path: dist/windows-amd64

  build-linux:
    name: Build Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build static binary
        run: |
          docker run --rm --platform=linux/${{ matrix.arch }} \
            -v "${{ github.workspace }}:/src" -w /src golang:1.24.2-alpine \
            sh -ec 'apk add --no-cache build-base musl-dev && \
              CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.arch }} \
              go build -trimpath -ldflags "-s -w -extldflags '\''-static'\''" \
              -o dist/linux-${{ matrix.arch }}/xiaozhi-server ./src/main.go'
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-${{ matrix.arch }}
          path: dist/linux-${{ matrix.arch }}

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-13
          - arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
      - name: Build native binary
        run: go build -trimpath -ldflags "-s -w" -o dist/darwin-${{ matrix.arch }}/xiaozhi-server ./src/main.go
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: build-darwin-${{ matrix.arch }}
          path: dist/darwin-${{ matrix.arch }}

  build-android:
    name: Build Android ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-linux-android
            target_arch: arm64-v8a
          - arch: arm
            target: armv7a-linux-androideabi
            target_arch: armeabi-v7a
    env:
      NDK_VERSION: r26d
      ANDROID_API: "21"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: android-ndk-${{ env.NDK_VERSION }}
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}
      - name: Download Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip && unzip -q android-ndk-${NDK_VERSION}-linux.zip
      - name: Build
        env:
          NDK_DIR: ${{ github.workspace }}/android-ndk-r26d
          CGO_ENABLED: "1"
          GOOS: android
          GOARCH: ${{ matrix.arch }}
        run: |
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          export CC="$TOOLCHAIN/bin/${{ matrix.target }}${ANDROID_API}-clang"
          export CGO_CFLAGS="--sysroot=$TOOLCHAIN/sysroot"
          go build -trimpath -tags=go_json -ldflags "-s -w" -o dist/android-${{ matrix.target_arch }}/xiaozhi-server ./src/main.go
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: build-android-${{ matrix.target_arch }}
          path: dist/android-${{ matrix.target_arch }}

  release:
    name: Package and publish release
    needs: [build-windows, build-linux, build-macos, build-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: artifacts
          merge-multiple: false
      - name: Create release packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p release
          package() {
            target="$1"
            binary="$2"
            extension="$3"
            package_dir="release/xiaozhi-server-go-${VERSION}-${target}"
            mkdir -p "$package_dir/docs"
            cp "artifacts/build-${target}/${binary}" "$package_dir/xiaozhi-server${extension}"
            cp config.yaml "$package_dir/config.yaml"
            cp README.md "$package_dir/README.md"
            cp LICENSE "$package_dir/LICENSE"
            cp docs/quick-start.md "$package_dir/docs/quick-start.md"
            cp docs/release.md "$package_dir/docs/release.md"
            cp -R web "$package_dir/web"
            if [ "$extension" = ".exe" ]; then
              cp scripts/start.bat "$package_dir/start.bat"
              (cd release && zip -qr "xiaozhi-server-go-${VERSION}-${target}.zip" "xiaozhi-server-go-${VERSION}-${target}")
            else
              cp scripts/start.sh "$package_dir/start.sh"
              chmod +x "$package_dir/start.sh" "$package_dir/xiaozhi-server"
              tar -czf "release/xiaozhi-server-go-${VERSION}-${target}.tar.gz" -C release "xiaozhi-server-go-${VERSION}-${target}"
            fi
          }
          package "windows-amd64" "xiaozhi-server.exe" ".exe"
          package "linux-amd64" "xiaozhi-server" ""
          package "linux-arm64" "xiaozhi-server" ""
          package "darwin-amd64" "xiaozhi-server" ""
          package "darwin-arm64" "xiaozhi-server" ""
          cp artifacts/build-android-arm64-v8a/xiaozhi-server release/xiaozhi-server-go-${VERSION}-android-arm64-v8a
          cp artifacts/build-android-armeabi-v7a/xiaozhi-server release/xiaozhi-server-go-${VERSION}-android-armeabi-v7a
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
